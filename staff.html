<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#1A5C4A">
<title>Hã — Staff</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Inter:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; min-height: 100vh;
  background: #1A5C4A;
  color: #fff;
  font-family: 'Inter', sans-serif;
  display: flex; align-items: center; justify-content: center;
  text-align: center;
  padding: 32px 24px;
}
.wrap { width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 20px; }

.label { font-size: 11px; letter-spacing: 2px; color: rgba(255,255,255,.5); }
.qr-card { background: #fff; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; max-width: 280px; }
#qr-code canvas, #qr-code img { width: 200px !important; height: 200px !important; }
.code-text { font-family: 'Nunito', sans-serif; font-size: 22px; font-weight: 900; color: #1A5C4A; letter-spacing: 4px; }
.validity { font-size: 13px; color: rgba(255,255,255,.55); }
.countdown { font-family: 'Nunito', sans-serif; font-size: 20px; font-weight: 800; background: rgba(0,0,0,.2); border-radius: 12px; padding: 10px 24px; }
.countdown span { color: #F5C842; }
/* PIN */
#pin-screen { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; }
#code-screen { display: none; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
.pin-title { font-family: 'Nunito', sans-serif; font-size: 24px; font-weight: 900; }
.pin-sub { font-size: 13px; color: rgba(255,255,255,.6); }
.pin-input { width: 160px; background: rgba(0,0,0,.25); border: 2px solid rgba(255,255,255,.2); border-radius: 14px; color: #fff; font-family: 'Nunito', sans-serif; font-size: 32px; font-weight: 800; letter-spacing: 8px; padding: 14px; text-align: center; outline: none; -webkit-text-security: disc; -webkit-appearance: none; }
.pin-input:focus { border-color: #F5C842; }
.pin-error { color: #FCA; font-size: 13px; display: none; }
.pin-error.show { display: block; }
.btn-pin { background: #F5C842; border: none; border-radius: 12px; color: #1A5C4A; font-family: 'Nunito', sans-serif; font-size: 17px; font-weight: 900; padding: 15px 48px; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">

  <div id="pin-screen">
    <div style="width:64px;height:64px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center"><img src="logo.png" style="width:48px;height:48px;object-fit:contain" alt="Hã"></div>
    <div class="pin-title">Área de Staff</div>
    <div class="pin-sub">Introduz o PIN para aceder</div>
    <input class="pin-input" type="password" id="pin-input" maxlength="4" inputmode="numeric" placeholder="····">
    <div class="pin-error" id="pin-error">PIN incorrecto. Tenta novamente.</div>
    <button class="btn-pin" id="btn-pin">Entrar</button>
  </div>

  <div id="code-screen">
    <div style="width:64px;height:64px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center"><img src="logo.png" style="width:48px;height:48px;object-fit:contain" alt="Hã"></div>
    <div class="label">MOSTRA ESTE QR CODE AO CLIENTE</div>
    <div class="qr-card">
      <div id="qr-code"></div>
    </div>
    <div class="validity">Válido até à <span style="color:#F5C842">meia-noite</span> de hoje</div>
    <div class="countdown">Expira em <span id="countdown">--:--:--</span></div>
  </div>

</div>

<script>
var API = 'https://ha-proxy.oxy-agency.workers.dev';
var TOKEN = '58D896A2D40ACBFF13DA8A436E4EFBB0';
var pinSessao = '';

function pedirCodigo(pin) {
  return fetch(API + '?action=qrcode&token=' + TOKEN + '&pin=' + encodeURIComponent(pin))
    .then(function(r) { return r.json(); });
}

function mostrarQR(codigo) {
  document.getElementById('qr-code').innerHTML = '';
  var url = 'https://clube.ha-restaurante.com/scan.html?code=' + codigo;
  new QRCode(document.getElementById('qr-code'), {
    text: url, width: 200, height: 200,
    colorDark: '#1A5C4A', colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.H
  });
  try { localStorage.setItem('ha_qr_code', JSON.stringify({code: codigo, date: new Date().toDateString()})); } catch(e) {}
}

function codigoGuardadoHoje() {
  try {
    var saved = JSON.parse(localStorage.getItem('ha_qr_code') || 'null');
    if (saved && saved.date === new Date().toDateString()) return saved.code;
  } catch(e) {}
  return null;
}

function erroPin(msg) {
  var el = document.getElementById('pin-error');
  el.textContent = msg;
  el.classList.add('show');
  document.getElementById('pin-input').value = '';
}

function iniciarCountdown() {
  function tick() {
    var agora = new Date();
    var meianoite = new Date();
    meianoite.setHours(24, 0, 0, 0);
    var diff = meianoite - agora;
    var h = Math.floor(diff / 3600000);
    var m = Math.floor((diff % 3600000) / 60000);
    var s = Math.floor((diff % 60000) / 1000);
    document.getElementById('countdown').textContent =
      (h < 10 ? '0' + h : h) + ':' + (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
    // Passou a meia-noite: pede o codigo novo ao servidor
    if (diff > 86399000) {
      pedirCodigo(pinSessao).then(function(d) { if (d.ok) mostrarQR(d.qr); }).catch(function() {});
    }
  }
  tick();
  setInterval(tick, 1000);
}

function entrar(codigo) {
  document.getElementById('pin-screen').style.display = 'none';
  document.getElementById('code-screen').style.display = 'flex';
  mostrarQR(codigo);
  iniciarCountdown();
}

document.getElementById('btn-pin').addEventListener('click', function() {
  var pin = document.getElementById('pin-input').value;
  if (!pin) return;
  var btn = document.getElementById('btn-pin');
  btn.disabled = true;
  pedirCodigo(pin)
    .then(function(data) {
      if (data.ok && data.qr) {
        pinSessao = pin;
        entrar(data.qr);
      } else {
        erroPin(data.erro || 'Erro. Tenta novamente.');
      }
    })
    .catch(function() {
      // Sem ligacao: usa o codigo de hoje guardado neste telemovel, se existir
      var guardado = codigoGuardadoHoje();
      if (guardado) { pinSessao = pin; entrar(guardado); }
      else erroPin('Sem ligacao. Tenta quando tiveres internet.');
    })
    .then(function() { btn.disabled = false; });
});

document.getElementById('pin-input').addEventListener('keyup', function(e) {
  if (e.keyCode === 13) document.getElementById('btn-pin').click();
});
</script>
</body>
</html>
