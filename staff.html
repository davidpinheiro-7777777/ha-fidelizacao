<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1A5C4A">
<title>Hã — Staff</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Inter:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; min-height: 100vh;
  background: #1A5C4A;
  color: #fff;
  font-family: 'Inter', sans-serif;
  display: flex; align-items: center; justify-content: center;
  text-align: center;
  padding: 32px 24px;
  -webkit-text-size-adjust: 100%;
}

.wrap { width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 0; }

/* PIN */
#pin-screen { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; }
.logo { height: 56px; filter: brightness(0) invert(1); margin-bottom: 4px; }
.pin-title { font-family: 'Nunito', sans-serif; font-size: 24px; font-weight: 900; }
.pin-sub { font-size: 13px; color: rgba(255,255,255,.6); }
.pin-input {
  width: 160px;
  background: rgba(0,0,0,.25);
  border: 2px solid rgba(255,255,255,.2);
  border-radius: 14px;
  color: #fff;
  font-family: 'Nunito', sans-serif;
  font-size: 32px;
  font-weight: 800;
  letter-spacing: 8px;
  padding: 14px;
  text-align: center;
  outline: none;
  -webkit-text-security: disc;
  -webkit-appearance: none;
}
.pin-input:focus { border-color: #F5C842; }
.pin-error { color: #FCA; font-size: 13px; display: none; }
.pin-error.show { display: block; }
.btn-pin {
  background: #F5C842;
  border: none;
  border-radius: 12px;
  color: #1A5C4A;
  font-family: 'Nunito', sans-serif;
  font-size: 17px;
  font-weight: 900;
  padding: 15px 48px;
  cursor: pointer;
}
.btn-pin:active { opacity: .85; }

/* CÓDIGO */
#code-screen { display: none; flex-direction: column; align-items: center; gap: 0; width: 100%; }
.code-logo { height: 48px; filter: brightness(0) invert(1); margin-bottom: 6px; }
.code-label { font-size: 11px; letter-spacing: 2px; color: rgba(255,255,255,.5); margin-bottom: 24px; }

.qr-card {
  background: #fff;
  border-radius: 20px;
  padding: 24px;
  margin-bottom: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  width: 100%;
  max-width: 280px;
}
#qr-code canvas, #qr-code img { width: 200px !important; height: 200px !important; }
.qr-hint { font-size: 12px; color: #888; }

.validity {
  font-size: 13px;
  color: rgba(255,255,255,.55);
  margin-bottom: 8px;
}
.validity span { color: #F5C842; }

.countdown {
  font-family: 'Nunito', sans-serif;
  font-size: 20px;
  font-weight: 800;
  background: rgba(0,0,0,.2);
  border-radius: 12px;
  padding: 10px 24px;
}
.countdown span { color: #F5C842; }
</style>
</head>
<body>
<div class="wrap">

  <!-- PIN -->
  <div id="pin-screen">
    <img class="logo" src="https://ha-restaurante.com/wp-content/uploads/2025/01/ha-logo-big.png" alt="Hã">
    <div class="pin-title">Área de Staff</div>
    <div class="pin-sub">Introduz o PIN para aceder</div>
    <input class="pin-input" type="password" id="pin-input" maxlength="4" inputmode="numeric" placeholder="····">
    <div class="pin-error" id="pin-error">PIN incorrecto. Tenta novamente.</div>
    <button class="btn-pin" onclick="verificarPin()">Entrar</button>
  </div>

  <!-- CÓDIGO QR -->
  <div id="code-screen">
    <img class="code-logo" src="https://ha-restaurante.com/wp-content/uploads/2025/01/ha-logo-big.png" alt="Hã">
    <div class="code-label">MOSTRA ESTE QR CODE AO CLIENTE</div>
    <div class="qr-card">
      <div id="qr-code"></div>
      <div class="qr-hint">O cliente aponta a câmara para registar</div>
    </div>
    <div class="validity">Válido até à <span>meia-noite</span> de hoje</div>
    <div class="countdown">Expira em <span id="countdown">--:--:--</span></div>
  </div>

</div>

<script>
const PIN = '1234'; // ← muda para o PIN da equipa
const API = 'https://script.google.com/macros/s/AKfycbwlRiz6vFIwSoF-u18NokDyt0NMj9PuxAKQqcul-mhpLrrCZOFvkOaNuPbTn9JJreBw/exec';

document.getElementById('pin-input').addEventListener('keyup', e => {
  if (e.key === 'Enter') verificarPin();
});

function verificarPin() {
  const pin = document.getElementById('pin-input').value;
  if (pin === PIN) {
    document.getElementById('pin-screen').style.display = 'none';
    document.getElementById('code-screen').style.display = 'flex';
    carregarQR();
    iniciarCountdown();
  } else {
    document.getElementById('pin-error').classList.add('show');
    document.getElementById('pin-input').value = '';
  }
}

async function carregarQR() {
  try {
    const res = await fetch(API + '?action=qrcode');
    const data = await res.json();
    if (data.ok && data.qr) {
      gerarQRCode(data.qr);
    } else {
      document.getElementById('qr-code').innerHTML = '<p style="color:red;font-size:13px">Erro ao gerar código. Recarrega a página.</p>';
    }
  } catch(e) {
    document.getElementById('qr-code').innerHTML = '<p style="color:red;font-size:13px">Sem ligação ao servidor. Verifica a internet e recarrega.</p>';
  }
}

function gerarQRCode(codigo) {
  document.getElementById('qr-code').innerHTML = '';
  new QRCode(document.getElementById('qr-code'), {
    text: codigo,
    width: 200,
    height: 200,
    colorDark: '#1A5C4A',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.H
  });
}

function iniciarCountdown() {
  function tick() {
    const agora = new Date();
    const meianoite = new Date();
    meianoite.setHours(24,0,0,0);
    const diff = meianoite - agora;
    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    document.getElementById('countdown').textContent =
      String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    if (diff <= 0) carregarQR(); // renova à meia-noite
  }
  tick();
  setInterval(tick, 1000);
}
</script>
</body>
</html>
